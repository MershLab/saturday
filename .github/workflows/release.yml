name: Release

# Builds desktop installers for every supported OS, publishes the pip
# installable CLI package to PyPI, and attaches the installers to a GitHub
# Release. Trigger: push a tag (v1.2.3). Also runs on workflow_dispatch for
# dry-runs (workflow_dispatch builds artifacts but does not publish).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e . pyinstaller pillow pywebview pytest

      - name: Tests
        run: python -m pytest -q

      - name: Generate brand icons
        run: python packaging/gen_icons.py

      - name: Bundle (PyInstaller)
        run: python -m PyInstaller saturday.spec --noconfirm

      - name: Windows installer (NSIS)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $v = "${env:GITHUB_REF_NAME}" -replace "^v", ""
          if ($v -eq "${env:GITHUB_REF_NAME}") { $v = python -c "from saturday import __version__; print(__version__)" }
          # OutFile resolves relative to the script's own directory
          # (installer\_output), and it isn't checked into git. Two prior
          # attempts to create it from inside the .nsi via !system had no
          # visible effect (silently no-op or mis-resolved) and both left
          # the exact same "Can't open output file" error with no further
          # diagnostic; creating it here removes all ambiguity about cwd.
          New-Item -ItemType Directory -Force -Path installer\_output | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$v" installer\saturday.nsi

      - name: Linux packages (deb + rpm + AppImage)
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm file
          bash scripts/build_linux.sh all

      - name: macOS DMG
        if: startsWith(matrix.name, 'macos')
        run: bash scripts/build_macos.sh

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p rel
          find . -type f \( \
            -name "Saturday-Setup-*.exe" -o -name "*.dmg" -o \
            -name "saturday_*.deb" -o -name "saturday-*.rpm" -o \
            -name "saturday_*.AppImage" \) -not -path "./.git/*" \
            -exec cp {} rel/ \;
          ls -la rel/

      - uses: actions/upload-artifact@v4
        with:
          name: saturday-${{ matrix.name }}
          path: rel/*
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed base-devel python python-build python-installer

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: makepkg
        run: |
          cp dist/saturday-*.whl packaging/arch/
          wheel="$(basename packaging/arch/saturday-*.whl)"
          ver="${wheel#saturday-}"
          ver="${ver%-py3-none-any.whl}"
          sed -i "s/^pkgver=.*/pkgver=$ver/" packaging/arch/PKGBUILD
          useradd -m builder
          chmod -R a+rwX packaging/arch
          su builder -c "cd packaging/arch && makepkg -f --noconfirm"
          mkdir -p rel
          cp packaging/arch/saturday-*.pkg.tar.zst rel/

      - uses: actions/upload-artifact@v4
        with:
          name: saturday-arch-any
          path: rel/*
          if-no-files-found: error

  pypi:
    runs-on: ubuntu-latest
    needs: build  # never publish to PyPI while the installer matrix is red
    # No PYPI_TOKEN secret exists on this repo, so the publish action falls
    # back to PyPI's Trusted Publishing (OIDC), which needs this permission.
    # The other required half is on PyPI's side: the "saturday" project's
    # Trusted Publisher settings need a publisher added for this repo/
    # workflow (or PYPI_TOKEN needs to be set instead) — real action nobody
    # but the project owner can take, tracked in docs/release-pypi-todo.md.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rel

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          generate_release_notes: true
