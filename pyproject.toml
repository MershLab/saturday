[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saturday"
version = "0.8.0"
description = "Saturday - a SOTA open agentic harness distilled from DeepSeek (R1/V3) research and Hermes agent patterns. Zero-dependency core; optional MCP/browser/vision/gateway surfaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saturday Labs" }]
keywords = ["agents", "llm", "deepseek", "hermes", "harness", "tools", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
browser = ["playwright>=1.40"]
desktop = ["pillow>=10", "pywebview>=6"]

[project.scripts]
saturday = "saturday.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"saturday.webui_assets" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# py310 target makes ruff's own parser catch pre-3.12-only f-string syntax
# (PEP 701) and other version regressions at lint time, not in user installs.
target-version = "py310"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# tests/scripts lean on ruff's fixable set; the remaining categories are
# deliberate test idioms (unused unpacking for symmetry, lambda patching).
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E741", "E702", "E731"]
"agent_demo/*" = ["F841"]
